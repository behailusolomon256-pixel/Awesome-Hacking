name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'README.md'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build debug APK with dependency retry
        working-directory: android
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt of 4"
            gradle --no-daemon --max-workers=2 --no-parallel assembleDebug
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait_seconds=$((attempt * 30))
              echo "Build failed. Waiting ${wait_seconds}s before retrying cached dependency downloads."
              sleep "$wait_seconds"
            fi
          done
          echo "All four build attempts failed."
          exit "$result"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hack-library-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
